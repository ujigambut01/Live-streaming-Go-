<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Streaming Hiburan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎥 Live Streaming Hiburan</h1>
    <p>Streaming legal dari YouTube</p>
</header>

<main class="container">

    <div class="video-wrapper">
        <!-- GANTI VIDEO ID YOUTUBE -->
        <iframe 
            src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1"
            title="YouTube live stream"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>

    <section class="info">
        <h2>📺 Tentang Streaming</h2>
        <p>
            Streaming ini menggunakan embed resmi YouTube.
            Semua hak cipta milik pemilik video.
        </p>
    </section>

</main>

<footer>
    <p>© 2026 Streaming Legal | GitHub Pages</p>
</footer>

</body>
</html>
